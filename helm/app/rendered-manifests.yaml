# Source: app/charts/backend/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment 
  namespace: my-app
  labels:
    helm.sh/chart: backend-0.1.0
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: my-app
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: my-app
  template:
    metadata:
      labels:
        helm.sh/chart: backend-0.1.0
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: my-app
        app.kubernetes.io/version: "0.2.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
      - name: backend
        image: daria1kulsitova/backend
        ports:
          - containerPort: 8000
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: REDIS_HOST
          value: "redis-master.redis.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: postgres-db
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: postgres-password
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: postgres-user
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: db
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: password
        - name: REDIS_USERNAME
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: username
        volumeMounts:
        - name: static-files
          mountPath: /staticfiles
        command:
          - /bin/sh
          - -c
        args:
          - python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 backend.wsgi
      volumes:
      - name: static-files
        persistentVolumeClaim:
          claimName: static-files-pvc
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
---
