apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment 
  namespace: my-app
  labels:
    helm.sh/chart: nginx-0.1.0
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: my-app
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
