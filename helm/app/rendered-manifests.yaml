# Source: app/charts/backend/templates/job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  namespace: my-app
  labels:
    helm.sh/chart: backend-0.1.0
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: my-app
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
spec:
  template:
    metadata:
      labels:
        helm.sh/chart: backend-0.1.0
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: my-app
        app.kubernetes.io/version: "0.2.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      containers:
      - name: migrate
        image: daria1kulsitova/backend
        command:
          - python
          - manage.py
          - migrate
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: REDIS_HOST
          value: "redis-master.redis.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: postgres-db
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: postgres-password
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: postgres-user
      restartPolicy: Never
  backoffLimit: 2
