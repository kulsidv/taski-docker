apiVersion: {{ .Chart.apiVersion }}
kind: Secret
metadata:
  name: {{ include "postgres.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "postgres.labels" | indent 4 }}
type: {{ .Values.secret.type }}
data:
  {{- range $key, $val := .Values.secret }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}