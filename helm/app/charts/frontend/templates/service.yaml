apiVersion: v1
kind: Service
metadata:
  name: {{ include "frontend.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "frontend.labels" . | indent 4 }}
spec:
  type: {{ .Values.service.spec.type }}
  selector:
{{ include "frontend.selectorLabels" . | indent 4 }}
  {{- with .Values.service.ports }}
  ports:
    - protocol: {{ .protocol }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
  {{- end }}