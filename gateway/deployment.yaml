apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment 
  namespace: my-app
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.1
        ports:
          - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: static-files
          mountPath: /staticfiles
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-configmap
      - name: static-files
        persistentVolumeClaim:
          claimName: static-files-pvc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1